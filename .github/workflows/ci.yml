name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Everything in scripts/test.sh, on the target platform
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: archlinux:base-devel@sha256:84cd9ef000b3cff245ec028e87965b84724f4bf1cc63fc2741ba927b88515ed6
    env:
      CARGO_TARGET_DIR: /tmp/spotify-target
      OMARCHY_PATH: /usr/share/omarchy
      QT_QPA_PLATFORM: offscreen
      XDG_RUNTIME_DIR: /tmp/spotify-runtime
    steps:
      - name: Install snapshot dependencies
        run: |
          # shellcheck disable=SC2016 # pacman expands these repository variables.
          echo 'Server = https://archive.archlinux.org/repos/2026/11/05/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm
          pacman -S --needed --noconfirm git jq ripgrep python qt6-declarative quickshell \
            libpulse openssl pkgconf rustup dbus xdg-utils avahi libgcrypt \
            shellcheck ruff actionlint zizmor gitleaks osv-scanner

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install supported Omarchy source and Rust toolchain
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/basecamp/omarchy.git /usr/share/omarchy
          git -C /usr/share/omarchy checkout 97e664bd971fa5a8691d89440d3738143499c438
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          echo '/usr/share/omarchy/bin' >> "$GITHUB_PATH"
          echo '/usr/lib/qt6/bin' >> "$GITHUB_PATH"

      - name: Restore the Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/spotify-target
          key: cargo-validate-${{ hashFiles('backend/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-validate-

      - name: Run every check
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          bash scripts/test.sh

  release-build:
    name: Locked release build (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libpulse-dev libssl-dev pkg-config

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Restore the Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-release-${{ matrix.architecture }}-${{ hashFiles('backend/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-release-${{ matrix.architecture }}-

      - name: Build exactly what a release builds
        run: |
          cargo build --locked --release --manifest-path backend/Cargo.toml
          backend/target/release/omaspotify-backend --version

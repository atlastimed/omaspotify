[package]
name = "omaspotify-backend"
version = "2.3.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Plugin-owned Spotify Connect playback backend for OmaSpotify"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
env_logger = { version = "0.11", default-features = false }
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
libc = "0.2"
librespot-connect = { git = "https://github.com/stappmus/librespot", rev = "6d3ecd76115c08a5e606d6f6d2181932314afed2", default-features = false }
librespot-core = { git = "https://github.com/stappmus/librespot", rev = "6d3ecd76115c08a5e606d6f6d2181932314afed2", default-features = false, features = ["native-tls"] }
librespot-metadata = { git = "https://github.com/stappmus/librespot", rev = "6d3ecd76115c08a5e606d6f6d2181932314afed2", default-features = false }
librespot-oauth = { git = "https://github.com/stappmus/librespot", rev = "6d3ecd76115c08a5e606d6f6d2181932314afed2", default-features = false }
librespot-playback = { git = "https://github.com/stappmus/librespot", rev = "6d3ecd76115c08a5e606d6f6d2181932314afed2", default-features = false, features = ["pulseaudio-backend"] }
log = "0.4"
mpris-server = { version = "=0.11.0", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tokio = { version = "1.54", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect"] }
toml = "0.9"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = true
panic = "abort"

# Size everywhere except where audio is decoded and processed in real time.
[profile.release.package.librespot-audio]
opt-level = 3

[profile.release.package.librespot-playback]
opt-level = 3

[profile.release.package."symphonia-core"]
opt-level = 3

[profile.release.package."symphonia-codec-vorbis"]
opt-level = 3

[profile.release.package."symphonia-bundle-mp3"]
opt-level = 3
